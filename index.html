
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pipeline 6 - My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 25px;
            text-align: center;
            background: #020617;
        }

        header h1 {
            color: #38bdf8;
            font-size: 30px;
        }

        nav {
            text-align: center;
            padding: 15px;
            background: #1e293b;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h2 {
            font-size: 45px;
            margin-bottom: 20px;
            color: #facc15;
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 30px;
        }

        .version {
            display: inline-block;
            background: #16a34a;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: #38bdf8;
            color: #020617;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn:hover {
            background: #facc15;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #020617;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My DevOps Website</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <section class="hero">

        <div class="version">
            PIPELINE 6 - VERSION 2
        </div>

        <h2>Welcome to My Website</h2>

        <p>
            This website is deployed using Jenkins CI/CD Pipeline.
        </p>

        <p>
            GitHub + Jenkins + Linux + DevOps
        </p>

        <br>

        <a href="#" class="btn">
            Build Successful!
        </a>

    </section>

    <footer>
        <p>
            © 2026 My Website | Jenkins Pipeline 6
        </p>
    </footer>

</body>
</html>
